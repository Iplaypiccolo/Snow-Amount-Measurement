<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 화면 틀 판번호: js/app.js 의 UI_VERSION 과 같아야 함. 화면 틀(이 파일의 칸 id 등)을 바꾸면 둘 다 올리세요 -->
<meta name="ui-version" content="2026100405">
<title>제설장비 지원 현황</title>
<link rel="stylesheet" href="css/style.css?v=4319c06f">
<script src="../auth/auth.js?v=3a94d92b"></script>
<script>
/* 로그인 잠금(가벼운 확인): 로그인 정보가 이 브라우저에 없으면 화면을 만들지 않고 안내만 보여 줍니다(?sample=1 시연 화면은 예외).
   첫 화면(../)에서 로그인한 뒤 들어오면 항상 통과합니다. (실제 권한 검사는 서버가 하며, 이 확인은 화면을 가리는 용도) */
if (!/[?&]sample(=|&|$)/.test(location.search) && (!window.SSAuth || !SSAuth.hasSession())) {      // ?sample=1(시연)은 로그인 없이
  document.documentElement.innerHTML = '<head><meta charset="UTF-8"><title>로그인 필요</title></head><body style="font-family:-apple-system,\'Malgun Gothic\',sans-serif;padding:40px;text-align:center;color:#0d1b14"><h2>로그인이 필요합니다</h2><p><a href="../" target="_top">첫 화면으로 가서 로그인하세요</a></p></body>';
  window.stop();
}
</script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">雪</div>
      <h1>제설장비 지원 현황<small>신속대응팀 · 지역본부 지원</small></h1>
    </div>
    <label class="user-box">접속 아이디(데모·미리보기)
      <select id="userSel" aria-label="접속 아이디 선택(데모용)"></select>
    </label>
    <div class="theme-toggle" role="group" aria-label="화면 모드">
      <button type="button" data-theme-set="light" aria-pressed="true">라이트 모드</button>
      <button type="button" data-theme-set="dark" aria-pressed="false">다크 모드</button>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="move">이동 현황</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="fleet">기관별 장비</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="branch">지사별 요청·편성</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="log" id="logTabBtn" hidden>로그 기록</button>
  </nav>
</header>

<div id="loading" role="status">불러오는 중…</div>
<main hidden>
  <!-- ===== 이동 현황 ===== -->
  <section class="panel" id="panel-move">
    <div class="summary">
      <div class="summary-head">
        <h2 class="move-title"><button type="button" class="dnav" id="prevDay" aria-label="전날">‹</button><label class="bigdate"><span id="dateText"></span><input type="date" id="dateInput" aria-label="이동 현황 날짜"></label><button type="button" class="dnav" id="nextDay" aria-label="다음날">›</button><span id="moveTitle">장비 지원 현황</span></h2>
        <p id="summaryNote"></p>
      </div>
      <div class="matrix-wrap"><table class="matrix" id="matrix"></table></div>
    </div>
    <div class="filters" id="filters"></div>
    <div id="destList"></div>
  </section>

  <!-- ===== 기관별 장비 ===== -->
  <section class="panel" id="panel-fleet" hidden>
    <div class="perm" id="perm-fleet"></div>
    <div class="round-bar" id="fleetRound"></div>
    <div class="org-grid" id="orgGrid"></div>
    <div class="toolbar" id="fleetFilters"></div>
    <div class="table-wrap tall"><table class="eq" id="eqTable"></table></div>
    <div class="savebar" id="save-fleet" hidden>
      <span class="save-state" aria-live="polite"></span>
      <button type="button" class="btn" data-revert="fleet">되돌리기</button>
      <button type="button" class="btn primary" data-save="fleet">확정</button>
    </div>
  </section>

  <!-- ===== 지사별 요청·편성 ===== -->
  <section class="panel" id="panel-branch" hidden>
    <div class="perm" id="perm-branch"></div>
    <div class="round-bar" id="branchRound"></div>
    <div class="toolbar" id="branchCtl"></div>
    <div class="table-wrap tall"><table class="branch" id="branchTable"></table></div>
    <div class="savebar" id="save-branch" hidden>
      <span class="save-state" aria-live="polite"></span>
      <button type="button" class="btn" data-revert="branch">되돌리기</button>
      <button type="button" class="btn primary" data-save="branch">저장</button>
    </div>
  </section>

  <!-- ===== 로그 기록 (log.view 권한) ===== -->
  <section class="panel" id="panel-log" hidden>
    <div class="perm" id="perm-log"></div>
    <div class="filters" id="logFilters"></div>
    <div class="table-wrap tall"><table class="logt" id="logTable"></table></div>
  </section>
</main>

<div class="sheet-backdrop" id="backdrop" hidden></div>
<aside class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></aside>
<div class="tip" id="tip" hidden role="tooltip"></div>
<div class="toast" id="toast" hidden role="status"></div>
<!-- 코드는 아래 순서대로 불러옵니다 (순서가 중요합니다). auth.js 는 위 <head> 에서 먼저 불러옴 -->
<script src="js/sample-data.js?v=152978cb"></script>
<script src="js/api.js?v=1e4a6ffe"></script>
<script src="js/app.js?v=c4a325b1"></script>
</body>
</html>
