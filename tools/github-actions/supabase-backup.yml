# Supabase(snow-support) 백업 + 자동 정지 방지
#  ※ 이 파일은 .github/workflows/supabase-backup.yml 로 옮겨야 동작합니다(docs/backup.md 3-0).
#  - 무료 플랜은 ① 1주일 동안 쓰지 않으면 자동 정지 ② 자동 백업 없음 → 이 작업이 둘 다 막습니다.
#  - 깨우기(keepalive): 월·목 03:00(한국 시각)에 DB 에 아주 가벼운 조회 1번.
#  - 백업(backup): 월요일 03:00 에 DB 전체(public·auth 스키마)를 내려받아 **암호화**해서 이 저장소의 `backups` 브랜치에 최근 8개만 보관.
#    · 비공개 저장소일 때만 백업합니다(공개 저장소면 건너뜀). 암호화되어 있어도 공개 저장소에는 올리지 않습니다.
#  - 필요한 비밀값(저장소 Settings → Secrets and variables → Actions 에서 사용자가 직접 넣음. 코드·대화에 쓰지 않음):
#      SUPABASE_DB_URL     : Supabase 대시보드 → Connect → "Session pooler" 연결 주소(비밀번호 포함)
#      BACKUP_PASSPHRASE   : 백업 파일 암호(아무 긴 문장). 잃어버리면 백업을 열 수 없으니 따로 보관
#  - 복원 방법: docs/backup.md
name: Supabase 백업·깨우기

on:
  schedule:
    - cron: '0 18 * * 0,3'      # 일·수 18:00 UTC = 월·목 03:00 KST
  workflow_dispatch:
    inputs:
      backup:
        description: '지금 백업도 할까요? (false 면 깨우기만)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: 비밀값 확인
        run: |
          if [ -z "$DB_URL" ]; then echo "::error::SUPABASE_DB_URL 비밀값이 없습니다. docs/backup.md 를 보고 넣어 주세요."; exit 1; fi

      - name: 깨우기(가벼운 조회)
        run: docker run --rm -e PGCONNECT_TIMEOUT=20 postgres:17 psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc "select now(), (select count(*) from public.profiles) as accounts"

      - name: 백업할지 정하기(월요일 또는 직접 실행 + 비공개 저장소)
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          dow=$(TZ=Asia/Seoul date +%u)      # 1 = 월요일
          want=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then want=${{ inputs.backup }}; elif [ "$dow" = "1" ]; then want=true; fi
          if [ "$want" = "true" ] && [ "$private" != "true" ]; then echo "::warning::공개 저장소라서 백업은 건너뜁니다(비공개로 바꾼 뒤부터 백업)."; want=false; fi
          if [ "$want" = "true" ] && [ -z "$PASSPHRASE" ]; then echo "::error::BACKUP_PASSPHRASE 비밀값이 없습니다."; exit 1; fi
          echo "backup=$want" >> "$GITHUB_OUTPUT"

      - name: DB 내려받기 → 압축 → 암호화
        if: steps.decide.outputs.backup == 'true'
        run: |
          stamp=$(TZ=Asia/Seoul date +%Y-%m-%d_%H%M)
          mkdir -p out
          docker run --rm -e PGCONNECT_TIMEOUT=20 postgres:17 pg_dump "$DB_URL" --schema=public --schema=auth --no-owner --no-privileges --quote-all-identifiers \
            | gzip -9 > out/db.sql.gz
          test "$(stat -c %s out/db.sql.gz)" -gt 10000 || { echo "::error::백업 파일이 너무 작습니다(내려받기 실패?)"; exit 1; }
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 -o "out/snow-support_${stamp}.sql.gz.gpg" out/db.sql.gz
          rm out/db.sql.gz
          ls -la out

      - name: backups 브랜치에 최근 8개만 보관
        if: steps.decide.outputs.backup == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git init -q keep && cd keep
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin backups 2>/dev/null; then git checkout -q FETCH_HEAD -- . 2>/dev/null || true; fi
          cp ../out/*.gpg .
          ls -1 snow-support_*.sql.gz.gpg | sort | head -n -8 | xargs -r rm -f          # 8개 넘으면 오래된 것부터 지움
          cat > README.md <<'EOF'
          # Supabase 백업 (암호화)
          이 브랜치는 자동 백업 전용입니다(최근 8개만, 매번 기록을 새로 만들어 오래된 백업은 남지 않음). 복원 방법은 main 브랜치의 docs/backup.md.
          EOF
          git checkout -q --orphan fresh && git add -A && git commit -qm "백업 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') (최근 $(ls -1 *.gpg | wc -l)개)"
          git push -qf origin fresh:backups
          ls -1 *.gpg
