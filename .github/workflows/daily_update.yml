name: 일일 신적설 데이터 갱신

on:
  schedule:
    - cron: '0 20 * * *'   # 매일 UTC 20:00 = KST 05:00
  workflow_dispatch: {}     # 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 어제 날짜 데이터 수집
        env:
          KMA_AUTH_KEY: ${{ secrets.KMA_AUTH_KEY }}
        run: python scripts/fetch_snow.py daily

      - name: 변경사항 커밋
        run: |
          git config user.name "snow-map-bot"
          git config user.email "actions@github.com"
          git add data/snow_data.json
          git diff --cached --quiet && echo "변경 없음" || git commit -m "chore: 신적설 데이터 자동 갱신 $(date -u +%Y-%m-%d)"
          git push
